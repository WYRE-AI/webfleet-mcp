services:
  webfleet-mcp:
    build: .
    ports:
      - "8080:8080"
    environment:
      - WEBFLEET_ACCOUNT=${WEBFLEET_ACCOUNT}
      - WEBFLEET_API_KEY=${WEBFLEET_API_KEY}
      - WEBFLEET_USERNAME=${WEBFLEET_USERNAME}
      - WEBFLEET_PASSWORD=${WEBFLEET_PASSWORD}
      - WEBFLEET_HOST=${WEBFLEET_HOST:-csv.webfleet.com}
      - WEBFLEET_LANG=${WEBFLEET_LANG:-en}
      - MCP_TRANSPORT=http
      - NODE_ENV=development
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
