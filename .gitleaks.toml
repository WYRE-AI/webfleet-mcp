title = "webfleet-mcp gitleaks config"

[extend]
useDefault = true

# Exact fake values used by the test suite (src/__tests__/helpers.ts and the
# tests), the stdio smoke script, and evals/. Each entry is anchored to the
# full value; do not widen these to patterns or paths.
[[allowlists]]
description = "Exact test fixtures"
regexTarget = "secret"
regexes = [
  '''^test-password-not-real-7Kq2$''',
  '''^test-apikey-not-real-0000-000000000a$''',
  '''^env-password-must-not-be-used$''',
  '''^env-apikey-must-not-be-used-00000000$''',
  '''^gw-password-xyz-123$''',
  '''^gw-apikey-not-real-00000000000000000$''',
  '''^tenant-a-apikey-not-real-00000000000$''',
  '''^tenant-b-apikey-not-real-00000000000$''',
  '''^another-password-123$''',
  '''^status-password-secret$''',
  '''^smoke-password-not-real$''',
  '''^eval-password-not-real$''',
  '''^test-s2s-7Hq2Lw9Zr4Kx8Mv3Nb6Pc1Td5Fg0Yj$''',
  # Dummy 36-character API key from the original scaffold (.env.example,
  # README, tests in commit 8e20786b). Still in history, never a real key.
  '''^0123456789abcdef0123456789abcdef0123$''',
]
